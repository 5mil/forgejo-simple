; Example minimal configuration generated by forgejo-simple
; No MySQL/Postgres required

APP_NAME = Forgejo Simple
RUN_MODE = prod

[server]
DOMAIN           = localhost
HTTP_PORT        = 3000
ROOT_URL         = http://localhost:3000/
DISABLE_SSH      = false
SSH_PORT         = 22

[database]
DB_TYPE  = sqlite3
PATH     = data/forgejo.db

[repository]
ROOT = data/forgejo-repositories

[lfs]
PATH = data/lfs

[security]
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = false
